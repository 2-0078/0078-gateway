# 서버 설정
server:
  port: 8000
  forward-headers-strategy: framework

# Spring Application 설정
spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service

  # Spring Cloud Gateway 설정
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      global-cors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
            allow-credentials: true
            allowed-headers:
              - X-requested-with
              - Authorization
              - content-type
              - X-AUTH-TOKEN
              - X-CSRF-TOKEN
            allowed-methods:
              - PUT
              - GET
              - POST
              - PATCH
              - DELETE
              - OPTIONS

      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/